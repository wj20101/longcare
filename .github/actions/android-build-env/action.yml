name: Android Build Environment
description: Prepare Java, Gradle and Android SDK. Quality gates belong to the calling workflow.
inputs:
  setup-android-sdk:
    description: Install required Android SDK packages.
    default: "false"
  android-packages:
    description: Android SDK packages to install.
    default: "platform-tools platforms;android-37.0"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v5
    - uses: android-actions/setup-android@v4.0.1
      if: ${{ inputs.setup-android-sdk == 'true' }}
      with:
        packages: ${{ inputs.android-packages }}
    - shell: bash
      run: chmod +x gradlew

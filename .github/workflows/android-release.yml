name: Android Release

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  release-build:
    runs-on: ubuntu-latest
    environment:
      name: release
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify Android CI success for target commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/verify_source_ci.sh

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'

      - name: Run release lint verification
        env:
          TX_FACE_MAVEN_REPO_USERNAME: ${{ secrets.TX_FACE_MAVEN_REPO_USERNAME || '' }}
          TX_FACE_MAVEN_REPO_PASSWORD: ${{ secrets.TX_FACE_MAVEN_REPO_PASSWORD || '' }}
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Enforce lint release readiness
        run: bash scripts/lint/verify_lint_warning_allowlist.sh app/build/reports/lint-results-debug.txt

      - name: Check vendor SDK risk policy
        run: bash scripts/quality/verify_vendor_sdk_release_readiness.sh app/build/reports/lint-results-debug.txt

      - name: Run release-required signing safety checks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$RELEASE_STORE_PASSWORD" ] || { echo "::error::Missing secret: RELEASE_STORE_PASSWORD"; exit 1; }
          [ -n "$RELEASE_KEY_ALIAS" ] || { echo "::error::Missing secret: RELEASE_KEY_ALIAS"; exit 1; }
          [ -n "$RELEASE_KEY_PASSWORD" ] || { echo "::error::Missing secret: RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Run release-required keystore decode check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [ -s "$RUNNER_TEMP/release.keystore" ] || { echo "::error::Decoded keystore is empty"; exit 1; }

      - name: Run release-required baseline profile source check
        run: |
          FILE_COUNT=$(find app/src -type f \( -name 'baseline-prof.txt' -o -name 'startup-prof.txt' -o -path '*/generated/baselineProfiles/*.txt' \) | wc -l | tr -d ' ')
          echo "Committed baseline profile files found: ${FILE_COUNT}"
          find app/src -type f \( -name 'baseline-prof.txt' -o -name 'startup-prof.txt' -o -path '*/generated/baselineProfiles/*.txt' \) | sort || true
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "::warning::No committed baseline profile files found in app/src. Release will continue."
          fi

      - name: Prepare app version code
        id: prepare_version_code
        run: python3 scripts/release/prepare_version.py

      - name: Extract app version metadata
        id: app_version
        run: |
          source scripts/quality/gradle_constants.sh
          VERSION_CODE=$(read_gradle_extra_value constants.gradle.kts appVersionCode)
          VERSION_NAME=$(read_gradle_extra_value constants.gradle.kts appVersionName)
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Failed to parse app version from constants.gradle.kts"
            exit 1
          fi
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Parsed version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Build release APK and AAB
        env:
          TX_FACE_MAVEN_REPO_USERNAME: ${{ secrets.TX_FACE_MAVEN_REPO_USERNAME || '' }}
          TX_FACE_MAVEN_REPO_PASSWORD: ${{ secrets.TX_FACE_MAVEN_REPO_PASSWORD || '' }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Run release-required exported component guard
        run: |
          bash scripts/quality/verify_release_exported_components.sh

      - name: Verify release APK identities and signatures
        run: |
          set -euo pipefail
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          BUILD_TOOLS=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "${BUILD_TOOLS}/apksigner"
          test -x "${BUILD_TOOLS}/aapt"
          shopt -s nullglob
          APKS=("app/build/outputs/apk/release/"*.apk)
          if [ "${#APKS[@]}" -ne 1 ] || [ ! -s "${APKS[0]}" ]; then
            echo "::error::Expected exactly one non-empty app Release APK"
            exit 1
          fi
          CERTS=$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APKS[0]}")
          CERT=$(printf '%s\n' "$CERTS" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          test -n "$CERT"
          BADGING=$("${BUILD_TOOLS}/aapt" dump badging "${APKS[0]}")
          PACKAGE="com.ytone.longcare"
          EXPECTED_NAME="$VERSION_NAME"
          printf '%s\n' "$BADGING" | grep -F "package: name='${PACKAGE}' versionCode='${VERSION_CODE}' versionName='${EXPECTED_NAME}'"
          if printf '%s\n' "$BADGING" | grep '^application-debuggable' > /dev/null; then
            echo "::error::app Release APK is debuggable"
            exit 1
          fi
          test -s "app/build/outputs/mapping/release/mapping.txt"

      - name: Rename release APK with version metadata
        id: release_apk
        run: |
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          DATE_STR=$(date +'%y%m%d')

          APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n1)
          if [ -z "$APK_SOURCE" ]; then
            echo "No release APK found under app/build/outputs/apk/release"
            exit 1
          fi

          APK_TARGET="app/build/outputs/apk/release/app-v${VERSION_NAME}-${DATE_STR}-${VERSION_CODE}-release.apk"
          if [ "$APK_SOURCE" != "$APK_TARGET" ]; then
            mv "$APK_SOURCE" "$APK_TARGET"
          fi

          echo "apk_path=${APK_TARGET}" >> "$GITHUB_OUTPUT"
          echo "Final APK name: ${APK_TARGET}"
          ls -lah app/build/outputs/apk/release

      - name: Rename release AAB with version metadata
        id: release_aab
        run: |
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          DATE_STR=$(date +'%y%m%d')

          AAB_SOURCE=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" | head -n1)
          if [ -z "$AAB_SOURCE" ]; then
            echo "No release AAB found under app/build/outputs/bundle/release"
            exit 1
          fi

          AAB_TARGET="app/build/outputs/bundle/release/app-v${VERSION_NAME}-${DATE_STR}-${VERSION_CODE}-release.aab"
          if [ "$AAB_SOURCE" != "$AAB_TARGET" ]; then
            mv "$AAB_SOURCE" "$AAB_TARGET"
          fi

          echo "aab_path=${AAB_TARGET}" >> "$GITHUB_OUTPUT"
          echo "Final AAB name: ${AAB_TARGET}"
          ls -lah app/build/outputs/bundle/release

      - name: Generate release checksums
        run: |
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > app/build/outputs/release-checksums.txt

      - name: Archive release mapping
        run: |
          cd app/build/outputs/mapping/release
          zip -r ../release-mapping.zip ./*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release-artifacts
          path: |
            app/src/**/baseline-prof.txt
            app/src/**/startup-prof.txt
            app/src/**/generated/baselineProfiles/**
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/**
            app/build/outputs/mapping/release-mapping.zip
            app/build/outputs/release-checksums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            baselineprofile/build/reports/**
            baselineprofile/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7

      - name: Push verified version
        id: bump_version_code
        run: bash scripts/release/push_version.sh

      - name: Compute release metadata
        id: release_meta
        run: |
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          TAG_NAME="v${VERSION_NAME}-${VERSION_CODE}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=Release v${VERSION_NAME} (${VERSION_CODE})" >> "$GITHUB_OUTPUT"

      - name: Generate release description
        id: release_notes
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          TAG_NAME="${{ steps.release_meta.outputs.tag_name }}"
          RELEASE_SHA="${{ steps.bump_version_code.outputs.commit_sha }}"
          SHORT_SHA="${RELEASE_SHA::7}"

          {
            echo "## LongCare ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "- Tag: \`${TAG_NAME}\`"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo
            echo "### 下载说明"
            echo '- app-*-release.apk/aab：LongCare 主应用。'
            echo '- release-checksums.txt：以上安装包的 SHA-256 校验和。'
            echo
            echo "### Latest commits"
            git log --no-merges -n 12 --pretty=format:'- %s (%h)'
            echo
          } > "${NOTES_FILE}"

          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish artifacts to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ steps.bump_version_code.outputs.commit_sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: false
          draft: false
          make_latest: "true"
          body_path: ${{ steps.release_notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release-mapping.zip
            app/build/outputs/release-checksums.txt

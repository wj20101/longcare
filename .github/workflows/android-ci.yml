name: Android CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  select-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_build: ${{ steps.select.outputs.run_build }}
      run_instrumentation: ${{ steps.select.outputs.run_instrumentation }}
      smoke_test_classes: ${{ steps.select.outputs.smoke_test_classes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check documentation
        run: python3 scripts/quality/verify_documentation.py
      - name: Select device smoke tests
        id: select
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/quality/select_ci_smoke.sh | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  verify-build:
    needs: select-checks
    if: needs.select-checks.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
      - name: Run CI quality gates
        run: bash scripts/quality/run_ci_checks.sh
      - name: Test and build
        run: bash scripts/quality/run_jvm_tests.sh :app:lintDebug :feature:carddiagnostics:lintDebug :app:assembleDebug
      - name: Enforce lint warnings
        run: bash scripts/lint/verify_lint_warning_allowlist.sh app/build/reports/lint-results-debug.txt
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7

  instrumentation-smoke:
    needs: [select-checks, verify-build]
    if: needs.select-checks.outputs.run_instrumentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_TEST_CLASSES: ${{ needs.select-checks.outputs.smoke_test_classes }}
      SMOKE_POST_BOOT_STABILIZATION_SECS: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
      - name: Enable KVM acceleration
        run: bash scripts/quality/enable_kvm.sh
      - name: Build app and instrumentation APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Pbaseline.enableX86_64=true
      - name: Run selected instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash .github/scripts/run-instrumentation-smoke.sh
      - name: Upload instrumentation smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-smoke-reports
          path: app/build/reports/androidTests/smoke/**
          if-no-files-found: warn
          retention-days: 7

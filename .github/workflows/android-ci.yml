name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      run_api37_readiness:
        description: Run the non-blocking Android 17 Beta readiness lane
        required: false
        default: false
        type: boolean

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || 'stable' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected_scope: ${{ steps.detect.outputs.affected_scope }}
      affected_modules: ${{ steps.detect.outputs.affected_modules }}
      verify_tasks: ${{ steps.detect.outputs.verify_tasks }}
      run_instrumentation: ${{ steps.detect.outputs.run_instrumentation }}
      smoke_test_classes: ${{ steps.detect.outputs.smoke_test_classes }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect affected modules and tasks
        id: detect
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/quality/affected-modules.sh --format github >> "$GITHUB_OUTPUT"

      - name: Print affected plan
        run: |
          echo "scope=${{ steps.detect.outputs.affected_scope }}"
          echo "modules=${{ steps.detect.outputs.affected_modules }}"
          echo "verify_tasks=${{ steps.detect.outputs.verify_tasks }}"
          echo "run_instrumentation=${{ steps.detect.outputs.run_instrumentation }}"
          echo "smoke_test_classes=${{ steps.detect.outputs.smoke_test_classes }}"
          echo "changed_files_count=${{ steps.detect.outputs.changed_files_count }}"

      - name: Publish affected plan summary
        run: |
          {
            echo "## Android CI affected plan"
            echo ""
            echo "- scope: \`${{ steps.detect.outputs.affected_scope }}\`"
            echo "- changed files: \`${{ steps.detect.outputs.changed_files_count }}\`"
            echo "- modules: \`${{ steps.detect.outputs.affected_modules }}\`"
            echo "- verify tasks: \`${{ steps.detect.outputs.verify_tasks }}\`"
            echo "- run instrumentation: \`${{ steps.detect.outputs.run_instrumentation }}\`"
            echo "- smoke test classes: \`${{ steps.detect.outputs.smoke_test_classes }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-build:
    needs: detect-affected
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
          run-workflow-quality-check: 'false'
          run-lint-ignore-policy-check: 'false'
          run-jetpack-compat-check: 'false'
          run-baselineprofile-journey-check: 'false'
          run-module-dependency-check: 'false'

      - name: Publish ci-required gate summary
        run: |
          {
            echo "## CI required gates"
            echo ""
            echo "- lint warning allowlist"
            echo "- lint ignore policy"
            echo "- jetpack compat guard"
            echo "- baseline profile journeys"
            echo "- module dependency whitelist"
            echo "- architecture boundaries"
            echo "- module API visibility"
            echo "- coroutine cancellation and empty catch guards"
            echo "- target SDK and exact alarm policy"
            echo "- Android build/dependency/readiness governance"
            echo "- instrumentation smoke class integrity"
            echo "- tracked keystore guard"
            echo "- Release validation entry contract"
            echo "- workflow quality guard"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ci-required quality gates
        run: |
          bash scripts/quality/verify_no_tracked_keystore_files.sh .
          bash scripts/quality/verify_ci_workflow_quality.sh
          bash scripts/quality/verify_release_validation_entry.sh .
          bash scripts/lint/verify_lint_ignore_policy.sh app/lint.xml
          bash scripts/quality/verify_jetpack_compat_apis.sh
          bash scripts/quality/verify_baselineprofile_journeys.sh
          bash scripts/quality/verify_cancellation_guards.sh app/src/main/kotlin
          bash scripts/quality/verify_no_empty_catch_blocks.sh .
          bash scripts/quality/verify_target_sdk_upgrade.sh settings.gradle.kts .github/workflows/android-ci.yml
          bash scripts/quality/verify_android_build_baseline.sh --project-root .
          bash scripts/quality/verify_dependency_policy.sh --project-root .
          bash scripts/quality/verify_target_sdk_readiness.sh --project-root .
          bash scripts/quality/verify_target_platform_test_matrix.sh --project-root .
          bash scripts/quality/verify_instrumentation_smoke_classes.sh --project-root .
          bash scripts/quality/verify_exact_alarm_permission_config.sh app/src/main/AndroidManifest.xml
          bash scripts/quality/verify_architecture_boundaries.sh .
          bash scripts/quality/verify_module_dependency_whitelist.sh .
          bash scripts/quality/verify_module_api_visibility.sh app/src/main/kotlin/com/ytone/longcare .

      - name: Run affected compile/lint/assemble verification
        run: ./gradlew --no-daemon ${{ needs.detect-affected.outputs.verify_tasks }}

      - name: Enforce generated lint warning allowlist
        run: bash scripts/lint/verify_lint_warning_allowlist.sh app/build/reports/lint-results-debug.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload baselineprofile APKs
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: baselineprofile-apks
          path: baselineprofile/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            baselineprofile/build/reports/**
            baselineprofile/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7

  current-target-api36-smoke:
    needs: detect-affected
    if: needs.detect-affected.outputs.run_instrumentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Enable KVM for Gradle Managed Devices
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
          run-workflow-quality-check: 'false'
          run-lint-ignore-policy-check: 'false'
          run-jetpack-compat-check: 'false'
          run-baselineprofile-journey-check: 'false'
          run-module-dependency-check: 'false'

      - name: Run blocking API 36 current-target smoke
        run: |
          ./gradlew --no-daemon :app:pixel6Api36DebugAndroidTest \
            -Pbaseline.enableX86_64=true \
            -Pandroid.testInstrumentationRunnerArguments.class="${{ needs.detect-affected.outputs.smoke_test_classes }}"

      - name: Publish API 36 smoke summary
        if: always()
        run: |
          {
            echo "## API 36 current-target smoke"
            echo ""
            echo "- blocking: true"
            echo "- device: pixel6Api36"
            echo "- classes: `${{ needs.detect-affected.outputs.smoke_test_classes }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API 36 smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api36-current-target-smoke
          path: |
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**
          if-no-files-found: warn
          retention-days: 7

  api37-beta-readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.run_api37_readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Enable KVM for Gradle Managed Devices
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
          run-workflow-quality-check: 'false'
          run-lint-ignore-policy-check: 'false'
          run-jetpack-compat-check: 'false'
          run-baselineprofile-journey-check: 'false'
          run-module-dependency-check: 'false'

      - name: Evaluate API 37 policy and static scope
        id: policy
        continue-on-error: true
        run: bash scripts/quality/evaluate_api37_readiness.sh --project-root .

      - name: Run API 37 Beta readiness smoke
        id: emulator
        continue-on-error: true
        env:
          API37_SMOKE_CLASSES: com.ytone.longcare.smoke.MainActivitySmokeTest,com.ytone.longcare.features.login.ui.LoginAgreementConsentRowTest,com.ytone.longcare.features.service.UserScopedBackgroundLifecycleIntegrationTest,com.ytone.longcare.core.ui.image.PhotoPreviewDialogTest,com.ytone.longcare.platform.webview.WebViewEntryInstrumentationTest,com.ytone.longcare.features.countdown.manager.CountdownAlarmPermissionFallbackIntegrationTest,com.ytone.longcare.features.maindashboard.ui.DashboardGridCompactModeTest,com.ytone.longcare.features.maindashboard.ui.TopHeaderAdaptationTest,com.ytone.longcare.features.profile.ui.ProfileScreenComponentsAdaptationTest,com.ytone.longcare.features.photoupload.ui.CameraWatermarkOverlayTest,com.ytone.longcare.presentation.validation.NfcValidationActivityTest,com.ytone.longcare.features.sales.SalesLargeFontLayoutTest
        run: |
          ./gradlew --no-daemon :app:pixelTabletApi37DebugAndroidTest \
            -Pbaseline.enableX86_64=true \
            -Pandroid.testInstrumentationRunnerArguments.class="${API37_SMOKE_CLASSES}"

      - name: Publish API 37 readiness summary
        if: always()
        run: |
          {
            echo "## Android 17 Beta / API 37 readiness"
            echo ""
            echo "- blocking for target 36: false"
            echo "- candidate promotion remains controlled by target_sdk_readiness.properties"
            echo "- policy evaluation: `${{ steps.policy.outcome }}`"
            echo "- emulator readiness: `${{ steps.emulator.outcome }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API 37 readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api37-beta-readiness
          path: |
            build/reports/api37-readiness/**
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**
          if-no-files-found: warn
          retention-days: 7

  cleanup-caches:
    needs: [verify-build, current-target-api36-smoke, api37-beta-readiness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/quality/cleanup_github_actions_caches.sh \
            --repo "${{ github.repository }}" \
            --max-total-mb 2048 \
            --keep-recent-days 1

[versions]
# Build tooling
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.11"

# KotlinX
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0-0.6.x-compat"
kotlinxSerialization = "1.11.0"

# AndroidX foundation
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxConstraintLayout = "2.2.2"
androidxCore = "1.19.0"
androidxExifInterface = "1.4.2"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.0"
androidxProfileInstaller = "1.4.1"
androidxStartup = "1.2.0"
androidxWindow = "1.5.1"

# Compose
composeBom = "2026.08.00"

# Camera and machine learning
androidxCamera = "1.6.2"
mlKitFaceDetection = "16.1.7"

# Persistence and background work
androidxDataStore = "1.2.1"
androidxRoom = "2.8.4"
androidxWork = "2.11.2"

# Dependency injection
androidxHilt = "1.4.0"
daggerHilt = "2.60.1"
javaxInject = "1"

# Networking and serialization
gson = "2.14.0"
moshi = "1.15.2"
okhttp = "5.5.0"
okio = "3.18.1"
protobufLite = "3.0.1"
retrofit = "3.0.0"

# Image loading
coil = "3.5.0"

# Vendor SDKs and diagnostics
amapLocation = "11.2.100"
buglyCrashReport = "4.1.9.3"
tencentCos = "5.9.52"

# Build quality
androidxBaselineProfile = "1.5.0-rc02"
androidxBenchmark = "1.5.0-rc02"

# Testing
androidxTest = "1.7.0"
androidxTestEspresso = "3.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestUiAutomator = "2.4.0"
junit4 = "4.13.2"
mockk = "1.14.11"
robolectric = "4.16.1"
truth = "1.4.5"

[libraries]
# Build logic
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX foundation
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-appcompat-resources = { module = "androidx.appcompat:appcompat-resources", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintLayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidxExifInterface" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileInstaller" }
startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidxStartup" }
window = { module = "androidx.window:window", version.ref = "androidxWindow" }

# CameraX
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-mlkit-vision = { module = "androidx.camera:camera-mlkit-vision", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }

# Jetpack Compose (versions supplied by the BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Persistence and background work
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDataStore" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
room-testing = { module = "androidx.room:room-testing", version.ref = "androidxRoom" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
work-testing = { module = "androidx.work:work-testing", version.ref = "androidxWork" }

# Dependency injection
dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "daggerHilt" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "daggerHilt" }
hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }

# KotlinX
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Networking and serialization
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okio-core = { module = "com.squareup.okio:okio", version.ref = "okio" }
protobuf-lite = { module = "com.google.protobuf:protobuf-lite", version.ref = "protobufLite" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# Image loading
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }

# Machine learning
face-detection = { module = "com.google.mlkit:face-detection", version.ref = "mlKitFaceDetection" }

# Vendor SDKs and diagnostics
amap-location = { module = "com.amap.api:location", version.ref = "amapLocation" }
crashreport = { module = "com.tencent.bugly:crashreport", version.ref = "buglyCrashReport" }
tencent-cos-android = { module = "com.qcloud.cos:cos-android", version.ref = "tencentCos" }

# Testing
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiAutomator" }
junit = { module = "junit:junit", version.ref = "junit4" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[bundles]
coil = [
    "coil-compose",
    "coil-core",
    "coil-gif",
    "coil-network-okhttp",
    "coil-svg",
    "coil-video",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baseline-profile = { id = "androidx.baselineprofile", version.ref = "androidxBaselineProfile" }
androidx-benchmark = { id = "androidx.benchmark", version.ref = "androidxBenchmark" }
androidx-room = { id = "androidx.room", version.ref = "androidxRoom" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

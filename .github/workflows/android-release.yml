name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_baseline_profile:
        description: "Generate baseline profile before release build (slow)"
        required: false
        type: boolean
        default: false
      tx_face_sdk_source:
        description: "Tencent face SDK source (local/maven)"
        required: false
        type: choice
        options:
          - local
          - maven
        default: local
      tx_face_live_coord:
        description: "Tencent face live SDK coordinate when source=maven"
        required: false
        type: string
      tx_face_normal_coord:
        description: "Tencent face normal SDK coordinate when source=maven"
        required: false
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
  TX_FACE_SDK_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tx_face_sdk_source || vars.TX_FACE_SDK_SOURCE || 'local' }}
  TX_FACE_LIVE_COORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tx_face_live_coord || vars.TX_FACE_LIVE_COORD || '' }}
  TX_FACE_NORMAL_COORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tx_face_normal_coord || vars.TX_FACE_NORMAL_COORD || '' }}
  TX_FACE_MAVEN_REPO_URL: ${{ vars.TX_FACE_MAVEN_REPO_URL || '' }}

jobs:
  release-build:
    runs-on: ubuntu-latest
    environment:
      name: release
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject tag-triggered auto version bump
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::VersionCode auto-bump is only supported for workflow_dispatch branch releases. Use workflow_dispatch instead of tag push."
            exit 1
          fi

      - name: Verify Android CI success for target commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="${GITHUB_SHA}"

          RUN_JSON="$(gh run list \
            --workflow "Android CI" \
            --limit 20 \
            --json status,conclusion,headSha,databaseId,displayTitle)"

          MATCH_COUNT="$(printf '%s' "${RUN_JSON}" | jq --arg target_sha "${TARGET_SHA}" '[.[] | select(.headSha == $target_sha)] | length')"
          if [ "${MATCH_COUNT}" -eq 0 ]; then
            echo "::error::No Android CI run found for commit ${TARGET_SHA}. Run Android CI first."
            exit 1
          fi

          STATUS="$(printf '%s' "${RUN_JSON}" | jq -r --arg target_sha "${TARGET_SHA}" '[.[] | select(.headSha == $target_sha)][0].status')"
          CONCLUSION="$(printf '%s' "${RUN_JSON}" | jq -r --arg target_sha "${TARGET_SHA}" '[.[] | select(.headSha == $target_sha)][0].conclusion')"
          RUN_ID="$(printf '%s' "${RUN_JSON}" | jq -r --arg target_sha "${TARGET_SHA}" '[.[] | select(.headSha == $target_sha)][0].databaseId')"

          if [ "${STATUS}" != "completed" ] || [ "${CONCLUSION}" != "success" ]; then
            echo "::error::Latest Android CI run for ${TARGET_SHA} is not green (run_id=${RUN_ID}, status=${STATUS}, conclusion=${CONCLUSION})."
            exit 1
          fi

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
          run-workflow-quality-check: 'false'
          run-lint-ignore-policy-check: 'false'
          run-jetpack-compat-check: 'false'
          run-baselineprofile-journey-check: 'false'
          run-module-dependency-check: 'false'

      - name: Validate face SDK source settings
        run: |
          echo "TX_FACE_SDK_SOURCE=${TX_FACE_SDK_SOURCE}"
          if [ "${TX_FACE_SDK_SOURCE}" = "maven" ]; then
            if [ -z "${TX_FACE_LIVE_COORD}" ] || [ -z "${TX_FACE_NORMAL_COORD}" ]; then
              echo "::error::TX_FACE_LIVE_COORD and TX_FACE_NORMAL_COORD are required when TX_FACE_SDK_SOURCE=maven"
              exit 1
            fi
          fi

      - name: Run ci-required quality gates
        run: |
          bash scripts/quality/verify_ci_workflow_quality.sh
          bash scripts/lint/verify_lint_ignore_policy.sh app/lint.xml
          bash scripts/quality/verify_jetpack_compat_apis.sh
          bash scripts/quality/verify_baselineprofile_journeys.sh
          bash scripts/quality/verify_module_dependency_whitelist.sh .

      - name: Run ci-required compile/lint/assemble verification
        env:
          TX_FACE_MAVEN_REPO_USERNAME: ${{ secrets.TX_FACE_MAVEN_REPO_USERNAME || '' }}
          TX_FACE_MAVEN_REPO_PASSWORD: ${{ secrets.TX_FACE_MAVEN_REPO_PASSWORD || '' }}
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Run release-required signing safety checks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$RELEASE_STORE_PASSWORD" ] || { echo "::error::Missing secret: RELEASE_STORE_PASSWORD"; exit 1; }
          [ -n "$RELEASE_KEY_ALIAS" ] || { echo "::error::Missing secret: RELEASE_KEY_ALIAS"; exit 1; }
          [ -n "$RELEASE_KEY_PASSWORD" ] || { echo "::error::Missing secret: RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Run release-required keystore decode check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [ -s "$RUNNER_TEMP/release.keystore" ] || { echo "::error::Decoded keystore is empty"; exit 1; }

      - name: Run release-required baseline profile source check
        run: |
          FILE_COUNT=$(find app/src -type f \( -name 'baseline-prof.txt' -o -name 'startup-prof.txt' -o -path '*/generated/baselineProfiles/*.txt' \) | wc -l | tr -d ' ')
          echo "Committed baseline profile files found: ${FILE_COUNT}"
          find app/src -type f \( -name 'baseline-prof.txt' -o -name 'startup-prof.txt' -o -path '*/generated/baselineProfiles/*.txt' \) | sort || true
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "::warning::No committed baseline profile files found in app/src. Release will continue."
          fi

      - name: Enable KVM group perms
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Free disk space for emulator
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile == 'true' }}
        run: bash scripts/quality/free_runner_disk_space.sh --min-free-mb 8192

      - name: Setup managed device
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile == 'true' }}
        env:
          TX_FACE_MAVEN_REPO_USERNAME: ${{ secrets.TX_FACE_MAVEN_REPO_USERNAME || '' }}
          TX_FACE_MAVEN_REPO_PASSWORD: ${{ secrets.TX_FACE_MAVEN_REPO_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon :baselineprofile:pixel6Api33Setup \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

      - name: Generate baseline profile (GMD)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile == 'true' }}
        timeout-minutes: 75
        env:
          TX_FACE_MAVEN_REPO_USERNAME: ${{ secrets.TX_FACE_MAVEN_REPO_USERNAME || '' }}
          TX_FACE_MAVEN_REPO_PASSWORD: ${{ secrets.TX_FACE_MAVEN_REPO_PASSWORD || '' }}
        run: |
          ./gradlew --no-daemon :app:generateReleaseBaselineProfile \
            -Pbaseline.enableX86_64=true \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

      - name: Upload baseline debug logs
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-debug-logs-release
          path: |
            app/build/outputs/managed_device_android_test_additional_output/**
            app/build/reports/**
            baselineprofile/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify baseline profile output
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile == 'true' }}
        run: |
          FILE_COUNT=$(find app/src -type f \( -name 'baseline-prof.txt' -o -name 'startup-prof.txt' -o -path '*/generated/baselineProfiles/*.txt' \) | wc -l | tr -d ' ')
          echo "Baseline profile files found: ${FILE_COUNT}"
          find app/src -type f \( -name 'baseline-prof.txt' -o -name 'startup-prof.txt' -o -path '*/generated/baselineProfiles/*.txt' \) | sort || true
          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "No baseline profile output was generated."
            echo "Profile-like files under build outputs:"
            find app/build baselineprofile/build -type f \( -name '*-prof.txt' -o -path '*/generated/baselineProfiles/*' \) | sort || true
            exit 1
          fi

      - name: Bump app version code
        id: bump_version_code
        env:
          RUN_BASELINE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_baseline_profile || 'false' }}
        run: |
          set -euo pipefail

          CURRENT_VERSION_CODE="$(sed -nE 's/.*appVersionCode by extra\(([0-9]+)\).*/\1/p' constants.gradle.kts | head -n1)"
          if [ -z "${CURRENT_VERSION_CODE}" ]; then
            echo "::error::Failed to parse appVersionCode from constants.gradle.kts"
            exit 1
          fi

          NEXT_VERSION_CODE="$((CURRENT_VERSION_CODE + 1))"
          sed -i -E "s/val appVersionCode by extra\([0-9]+\)/val appVersionCode by extra(${NEXT_VERSION_CODE})/" constants.gradle.kts

          if ! git diff -- constants.gradle.kts | grep -q "appVersionCode"; then
            echo "::error::appVersionCode was not changed"
            exit 1
          fi

          mapfile -t CHANGED_FILES < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          unexpected_files=()
          has_version_change="false"
          for changed_file in "${CHANGED_FILES[@]}"; do
            case "${changed_file}" in
              constants.gradle.kts)
                has_version_change="true"
                ;;
              app/src/*/baseline-prof.txt|app/src/*/startup-prof.txt|app/src/*/generated/baselineProfiles/*.txt)
                if [ "${RUN_BASELINE_PROFILE}" != "true" ]; then
                  unexpected_files+=("${changed_file}")
                fi
                ;;
              *)
                unexpected_files+=("${changed_file}")
                ;;
            esac
          done

          if [ "${has_version_change}" != "true" ]; then
            echo "::error::constants.gradle.kts was not changed"
            exit 1
          fi
          if [ "${#unexpected_files[@]}" -gt 0 ]; then
            echo "::error::Unexpected files changed during version bump:"
            printf '%s\n' "${unexpected_files[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constants.gradle.kts
          if [ "${RUN_BASELINE_PROFILE}" = "true" ]; then
            for changed_file in "${CHANGED_FILES[@]}"; do
              case "${changed_file}" in
                app/src/*/baseline-prof.txt|app/src/*/startup-prof.txt|app/src/*/generated/baselineProfiles/*.txt)
                  git add "${changed_file}"
                  ;;
              esac
            done
          fi
          git commit -m "chore(release): bump app version code to ${NEXT_VERSION_CODE}"
          BUMPED_SHA="$(git rev-parse HEAD)"
          git push

          echo "previous_version_code=${CURRENT_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEXT_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${BUMPED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Bumped appVersionCode: ${CURRENT_VERSION_CODE} -> ${NEXT_VERSION_CODE}"

      - name: Extract app version metadata
        id: app_version
        run: |
          VERSION_CODE=$(sed -nE 's/.*appVersionCode by extra\(([0-9]+)\).*/\1/p' constants.gradle.kts | head -n1)
          VERSION_NAME=$(sed -nE 's/.*appVersionName by extra\("([^"]+)"\).*/\1/p' constants.gradle.kts | head -n1)
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Failed to parse app version from constants.gradle.kts"
            exit 1
          fi
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Parsed version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Build release APK and AAB
        env:
          TX_FACE_MAVEN_REPO_USERNAME: ${{ secrets.TX_FACE_MAVEN_REPO_USERNAME || '' }}
          TX_FACE_MAVEN_REPO_PASSWORD: ${{ secrets.TX_FACE_MAVEN_REPO_PASSWORD || '' }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Run release-required exported component guard
        run: bash scripts/quality/verify_release_exported_components.sh

      - name: Rename release APK with version metadata
        id: release_apk
        run: |
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          DATE_STR=$(date +'%y%m%d')

          APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n1)
          if [ -z "$APK_SOURCE" ]; then
            echo "No release APK found under app/build/outputs/apk/release"
            exit 1
          fi

          APK_TARGET="app/build/outputs/apk/release/app-v${VERSION_NAME}-${DATE_STR}-${VERSION_CODE}-release.apk"
          if [ "$APK_SOURCE" != "$APK_TARGET" ]; then
            mv "$APK_SOURCE" "$APK_TARGET"
          fi

          echo "apk_path=${APK_TARGET}" >> "$GITHUB_OUTPUT"
          echo "Final APK name: ${APK_TARGET}"
          ls -lah app/build/outputs/apk/release

      - name: Rename release AAB with version metadata
        id: release_aab
        run: |
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          DATE_STR=$(date +'%y%m%d')

          AAB_SOURCE=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" | head -n1)
          if [ -z "$AAB_SOURCE" ]; then
            echo "No release AAB found under app/build/outputs/bundle/release"
            exit 1
          fi

          AAB_TARGET="app/build/outputs/bundle/release/app-v${VERSION_NAME}-${DATE_STR}-${VERSION_CODE}-release.aab"
          if [ "$AAB_SOURCE" != "$AAB_TARGET" ]; then
            mv "$AAB_SOURCE" "$AAB_TARGET"
          fi

          echo "aab_path=${AAB_TARGET}" >> "$GITHUB_OUTPUT"
          echo "Final AAB name: ${AAB_TARGET}"
          ls -lah app/build/outputs/bundle/release

      - name: Generate release checksums
        run: |
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > app/build/outputs/release-checksums.txt

      - name: Archive release mapping
        run: |
          cd app/build/outputs/mapping/release
          zip -r ../release-mapping.zip ./*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release-artifacts
          path: |
            app/src/**/baseline-prof.txt
            app/src/**/startup-prof.txt
            app/src/**/generated/baselineProfiles/**
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/**
            app/build/outputs/mapping/release-mapping.zip
            app/build/outputs/release-checksums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            baselineprofile/build/reports/**
            baselineprofile/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7

      - name: Compute release metadata
        id: release_meta
        run: |
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${TAG_NAME} (v${VERSION_NAME}, code ${VERSION_CODE})" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            TAG_NAME="v${VERSION_NAME}-${VERSION_CODE}"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Manual Release v${VERSION_NAME} (${VERSION_CODE})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release description
        id: release_notes
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          TAG_NAME="${{ steps.release_meta.outputs.tag_name }}"
          RELEASE_SHA="${{ steps.bump_version_code.outputs.commit_sha }}"
          SHORT_SHA="${RELEASE_SHA::7}"

          {
            echo "## LongCare ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "- Tag: \`${TAG_NAME}\`"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo
            echo "### Latest commits"
            git log --no-merges -n 12 --pretty=format:'- %s (%h)'
            echo
          } > "${NOTES_FILE}"

          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish artifacts to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ steps.bump_version_code.outputs.commit_sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release-mapping.zip
            app/build/outputs/release-checksums.txt

  cleanup-caches:
    needs: release-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cleanup GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/quality/cleanup_github_actions_caches.sh \
            --repo "${{ github.repository }}" \
            --max-total-mb 7168 \
            --keep-recent-days 2

name: Actions Storage Cleanup

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep runs newer than this many days"
        required: false
        default: "7"
      artifact_keep_days:
        description: "Keep artifacts newer than this many days"
        required: false
        default: "2"
      cache_max_total_mb:
        description: "Maximum allowed total cache size in MB"
        required: false
        default: "2048"
      cache_keep_recent_days:
        description: "Protect caches created or accessed within this many days"
        required: false
        default: "1"
      dry_run:
        description: "Dry run only (true/false)"
        required: false
        default: "true"

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days }}
          ARTIFACT_KEEP_DAYS: ${{ github.event.inputs.artifact_keep_days }}
          CACHE_MAX_TOTAL_MB: ${{ github.event.inputs.cache_max_total_mb }}
          CACHE_KEEP_RECENT_DAYS: ${{ github.event.inputs.cache_keep_recent_days }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          KEEP_DAYS="${KEEP_DAYS:-7}"
          ARTIFACT_KEEP_DAYS="${ARTIFACT_KEEP_DAYS:-2}"
          CACHE_MAX_TOTAL_MB="${CACHE_MAX_TOTAL_MB:-2048}"
          CACHE_KEEP_RECENT_DAYS="${CACHE_KEEP_RECENT_DAYS:-1}"
          DRY_RUN="${DRY_RUN:-false}"

          case "${DRY_RUN}" in
            true|false) ;;
            *)
              echo "Invalid DRY_RUN value: ${DRY_RUN} (must be true/false)" >&2
              exit 1
              ;;
          esac

          args=(
            --repo "${REPO}"
            --run-keep-days "${KEEP_DAYS}"
            --artifact-keep-days "${ARTIFACT_KEEP_DAYS}"
            --cache-max-total-mb "${CACHE_MAX_TOTAL_MB}"
            --cache-keep-recent-days "${CACHE_KEEP_RECENT_DAYS}"
          )

          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi

          bash scripts/quality/cleanup_github_actions_storage.sh "${args[@]}"

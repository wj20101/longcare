name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || 'stable' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected_scope: ${{ steps.detect.outputs.affected_scope }}
      affected_modules: ${{ steps.detect.outputs.affected_modules }}
      verify_tasks: ${{ steps.detect.outputs.verify_tasks }}
      run_instrumentation: ${{ steps.detect.outputs.run_instrumentation }}
      smoke_test_classes: ${{ steps.detect.outputs.smoke_test_classes }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect affected modules and tasks
        id: detect
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/quality/affected-modules.sh --format github >> "$GITHUB_OUTPUT"

      - name: Print affected plan
        run: |
          echo "scope=${{ steps.detect.outputs.affected_scope }}"
          echo "modules=${{ steps.detect.outputs.affected_modules }}"
          echo "verify_tasks=${{ steps.detect.outputs.verify_tasks }}"
          echo "run_instrumentation=${{ steps.detect.outputs.run_instrumentation }}"
          echo "smoke_test_classes=${{ steps.detect.outputs.smoke_test_classes }}"
          echo "changed_files_count=${{ steps.detect.outputs.changed_files_count }}"

      - name: Publish affected plan summary
        run: |
          {
            echo "## Android CI affected plan"
            echo ""
            echo "- scope: \`${{ steps.detect.outputs.affected_scope }}\`"
            echo "- changed files: \`${{ steps.detect.outputs.changed_files_count }}\`"
            echo "- modules: \`${{ steps.detect.outputs.affected_modules }}\`"
            echo "- verify tasks: \`${{ steps.detect.outputs.verify_tasks }}\`"
            echo "- run instrumentation: \`${{ steps.detect.outputs.run_instrumentation }}\`"
            echo "- smoke test classes: \`${{ steps.detect.outputs.smoke_test_classes }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-build:
    needs: detect-affected
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          setup-android-sdk: 'true'
          run-workflow-quality-check: 'false'
          run-lint-ignore-policy-check: 'false'
          run-jetpack-compat-check: 'false'
          run-baselineprofile-journey-check: 'false'
          run-module-dependency-check: 'false'

      - name: Publish ci-required gate summary
        run: |
          {
            echo "## CI required gates"
            echo ""
            echo "- lint warning allowlist"
            echo "- lint ignore policy"
            echo "- jetpack compat guard"
            echo "- baseline profile journeys"
            echo "- module dependency whitelist"
            echo "- architecture boundaries"
            echo "- module API visibility"
            echo "- coroutine cancellation and empty catch guards"
            echo "- target SDK and exact alarm policy"
            echo "- tracked keystore guard"
            echo "- approved QLZ AAR integrity"
            echo "- Release validation entry contract"
            echo "- workflow quality guard"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ci-required quality gates
        run: |
          bash scripts/quality/verify_no_tracked_keystore_files.sh .
          bash scripts/quality/verify_qlz_sdk_artifact.sh
          bash scripts/quality/test_qlz_sdk_artifact.sh
          bash scripts/quality/test_production_release_config.sh
          bash scripts/quality/test_vendor_sdk_release_readiness.sh
          bash scripts/lint/test_lint_warning_allowlist.sh
          bash scripts/quality/verify_ci_workflow_quality.sh
          bash scripts/quality/verify_release_validation_entry.sh .
          bash scripts/lint/verify_lint_ignore_policy.sh app/lint.xml
          bash scripts/quality/verify_jetpack_compat_apis.sh
          bash scripts/quality/verify_baselineprofile_journeys.sh
          bash scripts/quality/verify_cancellation_guards.sh app/src/main/kotlin
          bash scripts/quality/verify_no_empty_catch_blocks.sh .
          bash scripts/quality/verify_target_sdk_upgrade.sh constants.gradle.kts .github/workflows/android-ci.yml
          bash scripts/quality/verify_exact_alarm_permission_config.sh app/src/main/AndroidManifest.xml
          bash scripts/quality/verify_architecture_boundaries.sh .
          bash scripts/quality/verify_module_dependency_whitelist.sh .
          bash scripts/quality/verify_module_api_visibility.sh app/src/main/kotlin/com/ytone/longcare .

      - name: Run affected compile/lint/assemble verification
        run: ./gradlew --no-daemon ${{ needs.detect-affected.outputs.verify_tasks }}

      - name: Enforce generated lint warning allowlist
        run: bash scripts/lint/verify_lint_warning_allowlist.sh app/build/reports/lint-results-debug.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload baselineprofile APKs
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: baselineprofile-apks
          path: baselineprofile/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            baselineprofile/build/reports/**
            baselineprofile/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7

  cleanup-caches:
    needs: verify-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/quality/cleanup_github_actions_caches.sh \
            --repo "${{ github.repository }}" \
            --max-total-mb 2048 \
            --keep-recent-days 1

name: CI Health Monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of recent workflow runs to evaluate"
        required: false
        default: "50"
      fail_on_breach:
        description: "Fail workflow when thresholds are breached"
        required: false
        default: "false"

concurrency:
  group: ci-health-monitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CI health monitor
        id: health_check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAMPLE_SIZE="${{ github.event.inputs.sample_size }}"
          if [[ -z "${SAMPLE_SIZE}" ]]; then
            SAMPLE_SIZE="50"
          fi
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            DEFAULT_BRANCH="${GITHUB_REF_NAME:-master}"
          fi
          bash scripts/quality/monitor_ci_health.sh \
            "${{ github.repository }}" \
            "${SAMPLE_SIZE}" \
            "scripts/quality/ci_health_thresholds.json" \
            "build/ci-health" \
            "" \
            "${DEFAULT_BRANCH}"

      - name: Publish CI health summary
        if: always()
        run: |
          if [[ -f build/ci-health/ci_health_report.md ]]; then
            cat build/ci-health/ci_health_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI health report not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CI health artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-health-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-health/ci_health_report.md
            build/ci-health/ci_health_metrics.json
            build/ci-health/ci_health_violations.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Create or update CI rolling health issue on threshold breach
        if: steps.health_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          REPORT_FILE="build/ci-health/ci_health_report.md"
          BODY_FILE="${REPORT_FILE}"
          if [[ ! -f "${REPORT_FILE}" ]]; then
            FALLBACK_FILE="${RUNNER_TEMP:-/tmp}/ci_health_report_fallback_${GITHUB_RUN_ID:-unknown}.md"
            {
              echo "# CI rolling health threshold breach"
              echo ""
              echo "- repo: \`${REPO}\`"
              echo "- note: monitor detected a rolling-threshold breach, but the detailed report file was not generated."
              echo "- workflow run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
              echo "- next step: inspect monitor logs and artifacts for failure details."
            } > "${FALLBACK_FILE}"
            BODY_FILE="${FALLBACK_FILE}"
            echo "CI health report file missing at ${REPORT_FILE}; using fallback issue body ${BODY_FILE}."
          fi

          ISSUE_TITLE="CI rolling health threshold breach"
          ISSUE_NUMBER="$(gh issue list -R "${REPO}" --state open --search "${ISSUE_TITLE} in:title" --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "${ISSUE_NUMBER}" ]]; then
            ISSUE_NUMBER="$(gh issue list -R "${REPO}" --state open --search "CI health threshold breach in:title" --limit 1 --json number --jq '.[0].number // empty')"
          fi

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" -R "${REPO}" --body-file "${BODY_FILE}"
            echo "Updated existing issue #${ISSUE_NUMBER}"
          else
            gh issue create \
              -R "${REPO}" \
              --title "${ISSUE_TITLE}" \
              --body-file "${BODY_FILE}"
            echo "Created new CI health issue."
          fi

      - name: Threshold breach detected (non-blocking by default)
        if: steps.health_check.outcome == 'failure' && github.event.inputs.fail_on_breach != 'true'
        run: |
          echo "CI rolling health threshold breach detected, issue updated, workflow kept green."

      - name: Fail workflow on threshold breach
        if: steps.health_check.outcome == 'failure' && github.event.inputs.fail_on_breach == 'true'
        run: |
          echo "CI rolling health threshold breach detected."
          exit 1

name: Face SDK Migration Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "constants.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/face-sdk/**"
      - "scripts/lint/verify_lint_warning_allowlist.sh"
      - "scripts/quality/verify_gradle_stability.sh"
      - "scripts/quality/verify_ci_workflow_quality.sh"
      - "scripts/quality/verify_jetpack_compat_apis.sh"
      - "scripts/quality/verify_cancellation_guards.sh"
      - "scripts/quality/verify_no_empty_catch_blocks.sh"
      - "scripts/quality/verify_target_sdk_upgrade.sh"
      - "scripts/quality/verify_release_exported_components.sh"
      - "scripts/quality/verify_exact_alarm_permission_config.sh"
      - ".github/actions/android-build-env/action.yml"
      - ".github/workflows/face-sdk-migration-check.yml"

concurrency:
  group: face-sdk-migration-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maven-switch-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          run-workflow-quality-check: 'true'

      - name: Grant execute permission for face SDK scripts
        run: |
          chmod +x scripts/face-sdk/publish_tx_face_aars.sh
          chmod +x scripts/face-sdk/verify_tx_face_maven_switch.sh

      - name: Run face SDK maven switch verification
        run: bash scripts/face-sdk/verify_tx_face_maven_switch.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: face-sdk-migration-check-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 14

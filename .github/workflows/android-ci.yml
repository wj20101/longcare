name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "task_plan.md"
      - "findings.md"
      - "progress.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "task_plan.md"
      - "findings.md"
      - "progress.md"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || 'stable' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected_scope: ${{ steps.detect.outputs.affected_scope }}
      affected_modules: ${{ steps.detect.outputs.affected_modules }}
      verify_tasks: ${{ steps.detect.outputs.verify_tasks }}
      run_instrumentation: ${{ steps.detect.outputs.run_instrumentation }}
      smoke_test_classes: ${{ steps.detect.outputs.smoke_test_classes }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected modules and tasks
        id: detect
        run: bash scripts/quality/affected-modules.sh --format github >> "$GITHUB_OUTPUT"

      - name: Print affected plan
        run: |
          echo "scope=${{ steps.detect.outputs.affected_scope }}"
          echo "modules=${{ steps.detect.outputs.affected_modules }}"
          echo "verify_tasks=${{ steps.detect.outputs.verify_tasks }}"
          echo "run_instrumentation=${{ steps.detect.outputs.run_instrumentation }}"
          echo "smoke_test_classes=${{ steps.detect.outputs.smoke_test_classes }}"
          echo "changed_files_count=${{ steps.detect.outputs.changed_files_count }}"

      - name: Publish affected plan summary
        run: |
          {
            echo "## Android CI affected plan"
            echo ""
            echo "- scope: \`${{ steps.detect.outputs.affected_scope }}\`"
            echo "- changed files: \`${{ steps.detect.outputs.changed_files_count }}\`"
            echo "- modules: \`${{ steps.detect.outputs.affected_modules }}\`"
            echo "- verify tasks: \`${{ steps.detect.outputs.verify_tasks }}\`"
            echo "- run instrumentation: \`${{ steps.detect.outputs.run_instrumentation }}\`"
            echo "- smoke test classes: \`${{ steps.detect.outputs.smoke_test_classes }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-build:
    needs: detect-affected
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env
        with:
          run-workflow-quality-check: 'true'

      - name: Run affected verification tasks
        env:
          LONGCARE_ALLOW_UNSIGNED_RELEASE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: ./gradlew --no-daemon ${{ needs.detect-affected.outputs.verify_tasks }}

      - name: Collect quality snapshot and enforce quality gates
        run: |
          bash scripts/quality/run_quality_gate.sh \
            --project-root . \
            --output-dir build/quality-snapshot \
            --lint-report app/build/reports/lint-results-debug.txt \
            --source-root app/src/main/kotlin \
            --workflow-file .github/workflows/android-ci.yml

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload baselineprofile APKs
        if: needs.detect-affected.outputs.affected_scope == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: baselineprofile-apks
          path: baselineprofile/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/quality-snapshot/**
            build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            build/quality-snapshot/**
            baselineprofile/build/reports/**
            baselineprofile/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7

  instrumentation-smoke:
    needs:
      - detect-affected
      - verify-build
    if: needs.detect-affected.outputs.run_instrumentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up shared Android build environment
        uses: ./.github/actions/android-build-env

      - name: Assemble instrumentation APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Pbaseline.enableX86_64=true

      - name: Resolve emulator API for smoke
        id: target_sdk
        run: |
          TARGET_SDK=$(sed -nE 's/.*appTargetSdkVersion by extra\(([0-9]+)\).*/\1/p' constants.gradle.kts | head -n1)
          if [ -z "${TARGET_SDK}" ]; then
            echo "Failed to parse appTargetSdkVersion from constants.gradle.kts"
            exit 1
          fi
          STABLE_SMOKE_MAX_API=33
          EMULATOR_API="${TARGET_SDK}"
          if [ "${TARGET_SDK}" -gt "${STABLE_SMOKE_MAX_API}" ]; then
            EMULATOR_API="${STABLE_SMOKE_MAX_API}"
          fi
          echo "value=${EMULATOR_API}" >> "$GITHUB_OUTPUT"
          echo "target_sdk=${TARGET_SDK}" >> "$GITHUB_OUTPUT"
          echo "Using emulator API level: ${EMULATOR_API} (targetSdk=${TARGET_SDK})"

      - name: Free disk space for emulator
        run: bash scripts/quality/free_runner_disk_space.sh --min-free-mb 8192

      - name: Run instrumentation smoke test on emulator (attempt 1)
        id: smoke_attempt_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.target_sdk.outputs.value }}
          target: default
          arch: x86_64
          force-avd-creation: true
          cores: 4
          ram-size: 4096
          disk-size: 4096
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off -no-snapshot-load -no-snapshot-save -no-metrics
          disable-animations: false
          disable-linux-hw-accel: true
          script: SMOKE_TEST_CLASSES="${{ needs.detect-affected.outputs.smoke_test_classes }}" bash ./.github/scripts/run-instrumentation-smoke.sh

      - name: Run instrumentation smoke test on emulator (attempt 2 fallback API)
        id: smoke_attempt_2
        if: steps.smoke_attempt_1.outcome != 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: true
          cores: 4
          ram-size: 4096
          disk-size: 4096
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off -no-snapshot-load -no-snapshot-save -no-metrics
          disable-animations: false
          disable-linux-hw-accel: true
          script: SMOKE_TEST_CLASSES="${{ needs.detect-affected.outputs.smoke_test_classes }}" bash ./.github/scripts/run-instrumentation-smoke.sh

      - name: Verify instrumentation smoke attempts
        if: always()
        run: |
          ATTEMPT_1_OUTCOME='${{ steps.smoke_attempt_1.outcome }}'
          ATTEMPT_2_OUTCOME='${{ steps.smoke_attempt_2.outcome }}'
          echo "attempt1=${ATTEMPT_1_OUTCOME}"
          echo "attempt2=${ATTEMPT_2_OUTCOME}"

          if [ "${ATTEMPT_1_OUTCOME}" = "success" ] || [ "${ATTEMPT_2_OUTCOME}" = "success" ]; then
            echo "Instrumentation smoke passed."
            exit 0
          fi

          echo "Instrumentation smoke failed on both attempts."
          exit 1

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-smoke-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ github.job }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            build/reports/problems/**
            **/hs_err_pid*.log
            **/*.hprof
          if-no-files-found: warn
          retention-days: 7
